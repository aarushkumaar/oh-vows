<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — The HV Story</title>
  <meta name="description" content="All the photographs from the night — The HV Story Wedding." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#090909" />

  <!-- Supabase config -->
  <meta name="hvc-supabase-url" content="https://wfmzicocohuvrhlztrqc.supabase.co" />
  <meta name="hvc-supabase-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmbXppY29jb2h1dnJobHp0cnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDQ2MjYsImV4cCI6MjEwMzQyMDYyNn0.jy10-2PCgP3vY-lO5P2duyrRmX2BNkm2M0k1RhHxbbc" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/gallery/gallery.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/gallery/gallery.js" defer></script>
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────── -->
  <header class="gallery-header" role="banner">
    <div class="header-inner">
      <div class="header-left">
        <p class="header-eyebrow">The HV Story</p>
        <h1 class="header-title">Wedding Gallery</h1>
      </div>
      <div class="header-right" id="header-count" aria-live="polite"></div>
    </div>

    <!-- Sort + Filter bar -->
    <div class="gallery-controls" role="toolbar" aria-label="Gallery controls">
      <div class="sort-group" role="group" aria-label="Sort by">
        <span class="controls-label">Sort</span>
        <button class="sort-btn active" data-sort="time-desc" type="button" aria-pressed="true">Newest</button>
        <button class="sort-btn" data-sort="time-asc"  type="button" aria-pressed="false">Oldest</button>
        <button class="sort-btn" data-sort="name-asc"  type="button" aria-pressed="false">By name</button>
      </div>
      <div class="filter-group">
        <label for="guest-filter" class="controls-label">Guest</label>
        <select id="guest-filter" class="guest-select" aria-label="Filter by guest">
          <option value="">Everyone</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ── MAIN GRID ──────────────────────────────── -->
  <main id="gallery-grid" class="gallery-grid" role="main" aria-label="Photo gallery">
    <!-- Skeleton loaders injected by JS -->
    <div class="gallery-loading" id="gallery-loading" aria-live="polite">
      <div class="loading-text">Loading photographs...</div>
    </div>
  </main>

  <!-- ── EMPTY STATE ────────────────────────────── -->
  <div id="gallery-empty" class="gallery-empty" style="display:none" aria-live="polite">
    <p class="empty-headline">No photographs yet.</p>
    <p class="empty-sub">They'll appear here as guests take them.</p>
  </div>

  <!-- ── LIGHTBOX ───────────────────────────────── -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo detail" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close">✕</button>

    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous photo">‹</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next photo">›</button>

    <div class="lightbox-inner">
      <div class="lightbox-photo-wrap">
        <img id="lightbox-img" src="" alt="" class="lightbox-img" />
      </div>

      <div class="lightbox-details">
        <div class="detail-roll" id="lb-roll"></div>
        <div class="detail-name" id="lb-name"></div>
        <div class="detail-time" id="lb-time"></div>
        <div class="detail-shot" id="lb-shot"></div>
        <div class="detail-filter" id="lb-filter"></div>
        <a id="lb-download" class="lb-download-btn" download target="_blank" rel="noopener">
          Download
        </a>
      </div>
    </div>
  </div>

  <div id="lightbox-backdrop" class="lightbox-backdrop" aria-hidden="true"></div>

</body>
</html>
