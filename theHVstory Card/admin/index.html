<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — The HV Story</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Supabase config -->
  <meta name="hvc-supabase-url" content="https://wfmzicocohuvrhlztrqc.supabase.co" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/admin/admin.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/admin/admin.js" defer></script>
</head>

<body>

  <!-- ═══════════════════════════════════════
       LOGIN SCREEN
  ═══════════════════════════════════════ -->
  <div id="admin-login" role="main">
    <p class="login-eyebrow">The HV Story</p>
    <h1 class="login-headline">Wedding Archive</h1>

    <form id="login-form" class="login-form" novalidate>
      <label for="login-email" class="sr-only">Email</label>
      <input
        id="login-email"
        type="email"
        class="login-input"
        placeholder="Email"
        autocomplete="email"
        required
      />

      <label for="login-password" class="sr-only">Password</label>
      <input
        id="login-password"
        type="password"
        class="login-input"
        placeholder="Password"
        autocomplete="current-password"
        required
      />

      <p id="login-error" role="alert"></p>

      <button id="login-submit" type="submit" class="login-btn">
        Enter
      </button>
    </form>
  </div>


  <!-- ═══════════════════════════════════════
       ADMIN DASHBOARD
  ═══════════════════════════════════════ -->
  <div id="admin-dashboard" role="main" aria-label="Wedding photo archive dashboard">

    <!-- Nav -->
    <nav class="admin-nav" aria-label="Admin navigation">
      <span class="admin-nav-brand">The HV Story — Archive</span>
      <div class="admin-nav-right">
        <button id="refresh-btn" class="admin-signout" type="button" aria-label="Refresh data">
          Refresh
        </button>
        <button id="admin-signout" class="admin-signout" type="button" aria-label="Sign out">
          Sign out
        </button>
      </div>
    </nav>

    <!-- Stats -->
    <div class="admin-stats" role="region" aria-label="Event statistics">
      <div class="stat-block">
        <div id="stat-guests" class="stat-value" aria-label="Total guests">—</div>
        <div class="stat-label">Guests</div>
      </div>
      <div class="stat-block">
        <div id="stat-rolls" class="stat-value" aria-label="Total rolls">—</div>
        <div class="stat-label">Rolls</div>
      </div>
      <div class="stat-block">
        <div id="stat-photos" class="stat-value" aria-label="Photographs uploaded">—</div>
        <div class="stat-label">Photographs</div>
      </div>
      <div class="stat-block">
        <div id="stat-done" class="stat-value" aria-label="Completed rolls">—</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <!-- Rolls list -->
    <div class="admin-content">
      <div class="section-header">
        <h2 class="section-title">Rolls</h2>
        <span id="rolls-count" class="section-count"></span>
      </div>

      <div
        id="rolls-list"
        class="rolls-list"
        role="list"
        aria-label="Guest rolls"
        aria-live="polite"
      >
        <div class="admin-loading">Loading...</div>
      </div>
    </div>

  </div><!-- /#admin-dashboard -->


  <!-- ═══════════════════════════════════════
       PHOTO PANEL (slides over dashboard)
  ═══════════════════════════════════════ -->
  <div id="photo-panel" role="dialog" aria-modal="true" aria-label="Roll photographs">

    <div class="panel-header">
      <button id="panel-back-btn" class="panel-back" type="button" aria-label="Back to rolls">
        ← Back
      </button>
      <h2 id="panel-title" class="panel-title"></h2>
      <button id="panel-download-all" class="panel-download-all" type="button">
        Download all
      </button>
    </div>

    <div class="panel-content">
      <div id="photo-grid" class="photo-grid" role="list" aria-label="Photographs"></div>
    </div>

  </div>

  <style>
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>

</body>
</html>
